name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: bank.py lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0

      - name: 入库校验
        run: uv run python scripts/bank.py lint

      - name: 分布统计（参考）
        if: always()
        run: uv run python scripts/bank.py stats
