name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: bank.py lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0

      - name: 入库校验
        run: bash scripts/lint.sh

      - name: 文档校验（doclint）
        if: always()
        run: uv run python scripts/bank.py doclint

      - name: 代码检查（ruff）
        if: always()
        run: uv run --group dev ruff check scripts tests

      - name: 单元测试
        if: always()
        run: uv run --group dev pytest -q

      - name: 机器核验（重跑答案核验脚本，凭证保真）
        if: always()
        run: uv run --with sympy python scripts/checks/run_checks.py

      - name: 分布统计（参考）
        if: always()
        run: uv run python scripts/bank.py stats
