<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥数题库 · 知识点指示图</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-mut:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --d1:#86b6ef; --d2:#5598e7; --d3:#2a78d6; --d4:#1c5cab; --d5:#0d366b;
    --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#184f95; --h7:#0d366b;
    --chip-ink-light:#0b0b0b; --chip-ink-dark:#ffffff;
    --m-weak:#c0392b; --m-mid:#a97a0a; --m-solid:#1e7d43;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-mut:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --d1:#184f95; --d2:#256abf; --d3:#3987e5; --d4:#6da7ec; --d5:#9ec5f4;
      --h1:#104281; --h2:#184f95; --h3:#1c5cab; --h4:#256abf; --h5:#3987e5; --h6:#6da7ec; --h7:#9ec5f4;
      --m-weak:#e0705c; --m-mid:#d9a13c; --m-solid:#4cbf82;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-mut:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --d1:#184f95; --d2:#256abf; --d3:#3987e5; --d4:#6da7ec; --d5:#9ec5f4;
    --h1:#104281; --h2:#184f95; --h3:#1c5cab; --h4:#256abf; --h5:#3987e5; --h6:#6da7ec; --h7:#9ec5f4;
    --m-weak:#e0705c; --m-mid:#d9a13c; --m-solid:#4cbf82;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background:var(--page); color:var(--ink-1); min-height:100vh; padding:20px 22px 48px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:14px; margin-bottom:6px; }
  h1 { font-size:20px; font-weight:700; }
  .meta { color:var(--ink-2); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0 4px; }
  .controls input[type=search] { padding:7px 12px; border:1px solid var(--grid); border-radius:8px; background:var(--surface-1); color:var(--ink-1); font-size:13px; width:240px; }
  .fbtn, #themeBtn { padding:5px 10px; border:1px solid var(--grid); border-radius:999px; background:var(--surface-1); color:var(--ink-2); font-size:12px; cursor:pointer; }
  .fbtn.on { border-color:var(--d3); color:var(--ink-1); font-weight:600; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; color:var(--ink-mut); font-size:12px; margin:10px 0 18px; }
  .lg-item { display:flex; gap:4px; align-items:center; }
  .sw { width:14px; height:14px; border-radius:4px; display:inline-block; }
  .sw.z { background:transparent; border:1.5px dashed var(--grid); }
  h2.cat { font-size:15px; margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--grid); display:flex; justify-content:space-between; align-items:baseline;}
  h2.cat .sub { color:var(--ink-mut); font-size:12px; font-weight:400; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .node { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .node.dim { opacity:.35; }
  .nhead { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nname { font-size:13.5px; font-weight:650; }
  .ntotal { color:var(--ink-mut); font-size:12px; white-space:nowrap; }
  .heat { display:grid; grid-template-columns:repeat(5,1fr); gap:2px; margin-top:9px; }
  .cell { min-height:30px; padding:2px 0; border-radius:5px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; line-height:1.1; cursor:default; }
  .cell .st { font-size:9px; opacity:.75; }
  .cell.z { border:1.5px dashed var(--grid); color:var(--ink-mut); background:transparent; }
  .cell .sup { font-size:8.5px; letter-spacing:.02em; }
  .cell.b1,.cell.b2,.cell.b3 { color:var(--chip-ink-light); background:var(--h1); }
  .cell.b2 { background:var(--h2); } .cell.b3 { background:var(--h3); }
  .cell.b4,.cell.b5,.cell.b6,.cell.b7 { color:var(--chip-ink-dark); }
  .cell.b4 { background:var(--h4); } .cell.b5 { background:var(--h5); }
  .cell.b6 { background:var(--h6); } .cell.b7 { background:var(--h7); }
  :root[data-theme="dark"] .viz-root .cell.b1, :root[data-theme="dark"] .viz-root .cell.b2, :root[data-theme="dark"] .viz-root .cell.b3 { color:var(--chip-ink-dark); }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .viz-root .cell.b1, :root:where(:not([data-theme="light"])) .viz-root .cell.b2, :root:where(:not([data-theme="light"])) .viz-root .cell.b3 { color:var(--chip-ink-dark); } }
  details { margin-top:8px; }
  summary { color:var(--ink-2); font-size:12px; cursor:pointer; user-select:none; }
  .plist { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--grid); border-radius:7px; padding:3px 7px; font-size:11.5px; color:var(--ink-1); background:var(--surface-1); cursor:default; }
  .chip.hide { display:none; } .chip.dimm { opacity:.25; }
  .dot { width:9px; height:9px; border-radius:3px; flex:none; }
  .dot.d1{background:var(--d1);} .dot.d2{background:var(--d2);} .dot.d3{background:var(--d3);} .dot.d4{background:var(--d4);} .dot.d5{background:var(--d5);}
  .chip .cid { color:var(--ink-2); }
  #tip { position:fixed; z-index:50; background:var(--surface-1); color:var(--ink-1); border:1px solid var(--grid); border-radius:8px; padding:7px 10px; font-size:12px; max-width:300px; box-shadow:0 4px 14px rgba(0,0,0,.18); pointer-events:none; display:none; }
  #tip .t2 { color:var(--ink-2); margin-top:2px; }
  .prow { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:8px; color:var(--ink-mut); font-size:11.5px; }
  .pchip { border:1px dashed var(--grid); border-radius:7px; padding:2px 7px; font-size:11.5px; color:var(--ink-2); background:transparent; cursor:pointer; }
  .pchip:hover { border-color:var(--d3); color:var(--ink-1); }
  /* 掌握层：开关开启时节点卡按学生四档状态描边（阈值正本 scripts/student_profile.py）。
     悬停高亮两条规则放在其后且同特异度，保证前置/后继高亮盖过掌握描边 */
  .show-mastery .node.m-weak { border-color:var(--m-weak); box-shadow:0 0 0 1px var(--m-weak); }
  .show-mastery .node.m-mid { border-color:var(--m-mid); box-shadow:0 0 0 1px var(--m-mid); }
  .show-mastery .node.m-solid { border-color:var(--m-solid); box-shadow:0 0 0 1px var(--m-solid); }
  .show-mastery .node.m-none { border-style:dashed; }
  .mst { display:none; font-size:11px; font-weight:400; white-space:nowrap; }
  .show-mastery .mst { display:inline; }
  .mst.m-weak { color:var(--m-weak); } .mst.m-mid { color:var(--m-mid); }
  .mst.m-solid { color:var(--m-solid); } .mst.m-none { color:var(--ink-mut); }
  .mlg { display:none; }
  .show-mastery .mlg { display:flex; }
  .viz-root .node.hl-pre { border-color:var(--d3); box-shadow:0 0 0 1px var(--d3); }
  .viz-root .node.hl-succ { border-style:dashed; border-color:var(--d4); }
  .node.flash { animation:ndflash 1.5s ease-out; }
  @keyframes ndflash { 0% { box-shadow:0 0 0 3px var(--d3); } 100% { box-shadow:0 0 0 0 transparent; } }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header>
    <h1>奥数题库 · 知识点指示图</h1>
    <span class="meta" id="metaLine"></span>
    <button id="themeBtn" title="切换明暗">◐ 明暗</button>
  </header>
  <div class="controls">
    <input type="search" id="q" placeholder="搜题号 / 标题 / 赛事…">
    <span style="color:var(--ink-mut);font-size:12px">难度筛选：</span>
    <button class="fbtn on" data-d="0">全部</button>
    <button class="fbtn" data-d="1">★1</button><button class="fbtn" data-d="2">★2</button>
    <button class="fbtn" data-d="3">★3</button><button class="fbtn" data-d="4">★4</button>
    <button class="fbtn" data-d="5">★5</button>
    <button class="fbtn" id="masteryBtn" hidden>掌握层</button>
  </div>
  <div class="legend">
    <span class="lg-item">难度：<span class="sw" style="background:var(--d1)"></span>★1 <span class="sw" style="background:var(--d2)"></span>★2 <span class="sw" style="background:var(--d3)"></span>★3 <span class="sw" style="background:var(--d4)"></span>★4 <span class="sw" style="background:var(--d5)"></span>★5</span>
    <span class="lg-item">格内数字＝该知识点该星级题数（颜色越深越多）</span>
    <span class="lg-item"><span class="sw z"></span>＝缺口（0 题，扩容优先级）</span>
    <span class="lg-item" id="supplyLg">缺口格灰字「可补n·est」＝候选池可补量（est 为启发式估级，非承诺量）</span>
    <span class="lg-item"><span class="pchip" style="cursor:default">前置</span>＝建议先掌握的知识点（点击跳转；悬停节点卡高亮前置/后继）</span>
    <span class="lg-item mlg">掌握：<span class="sw" style="background:var(--m-solid)"></span>稳固 <span class="sw" style="background:var(--m-mid)"></span>进行中 <span class="sw" style="background:var(--m-weak)"></span>薄弱 <span class="sw z"></span>未测</span>
  </div>
  <div id="app"></div>
  <div id="tip"></div>
</div>
<script>
const DATA = __MAP_DATA__;
const app = document.getElementById('app');
/* 前置依赖边（正本 taxonomy/prereq.yml）→ preOf/succOf 两张邻接表 */
const preOf = new Map(), succOf = new Map();
(DATA.edges || []).forEach(e => {
  if (!preOf.has(e.to)) preOf.set(e.to, []);
  preOf.get(e.to).push(e.from);
  if (!succOf.has(e.from)) succOf.set(e.from, []);
  succOf.get(e.from).push(e.to);
});
document.getElementById('metaLine').textContent =
  `共 ${DATA.total} 题 · ${DATA.cats.reduce((s,c)=>s+c.nodes.length,0)} 个知识点节点 · 生成于 ${DATA.generated} · 静态快照，用 bank.py doctor 检查新鲜度`;
/* 供给层缺失（clone 后候选池未重建）→ 页头提示 + 撤掉对应图例 */
if (!DATA.has_supply) {
  const warn = document.createElement('span');
  warn.className = 'meta';
  warn.textContent = '⚠ 候选供给未载入：candidates/mathnet.jsonl 缺失，重建候选池后重跑 bank.py map';
  document.querySelector('header').appendChild(warn);
  document.getElementById('supplyLg').style.display = 'none';
}
const M_CLS = {'稳固':'m-solid','进行中':'m-mid','薄弱':'m-weak','未测':'m-none'};
let maxCell = 1;
DATA.cats.forEach(c=>c.nodes.forEach(n=>Object.values(n.stars).forEach(v=>{ if(v>maxCell) maxCell=v; })));
const bucket = v => v===0 ? 0 : Math.max(1, Math.ceil(v/maxCell*7));
for (const c of DATA.cats) {
  const done = c.nodes.reduce((s,n)=>s+n.total,0);
  const h2 = document.createElement('h2'); h2.className='cat';
  h2.innerHTML = `<span>${c.label}</span><span class="sub">${c.nodes.length} 节点 · 覆盖 ${done} 题次</span>`;
  app.appendChild(h2);
  const grid = document.createElement('div'); grid.className='grid'; app.appendChild(grid);
  for (const n of c.nodes) {
    const el = document.createElement('div'); el.className='node';
    el.id = 'nd-' + n.key; el.dataset.key = n.key;
    const cells = [1,2,3,4,5].map(d=>{
      const v = n.stars[String(d)]; const b = bucket(v);
      const sup = (n.supply || {})[String(d)] || 0;
      const ids = n.problems.filter(p=>p.d===d).map(p=>p.id).slice(0,8).join('、')||'—';
      const l2 = (v===0 && sup) ? `候选池可补 ${sup} 题（est 为估级，非承诺量）` : ids;
      const supHtml = (v===0 && sup) ? `<span class="sup">可补${sup}·est</span>` : '';
      return `<div class="cell ${b===0?'z':'b'+b}" data-tip="★${d} × ${v} 题|${l2}"><span>${v}</span><span class="st">★${d}</span>${supHtml}</div>`;
    }).join('');
    const chips = n.problems.map(p=>
      `<span class="chip" data-d="${p.d}" data-txt="${(p.id+' '+p.t+' '+(p.c||'')).toLowerCase()}" data-tip="${p.id}｜${'★'.repeat(p.d)}|${p.t}（${p.c||'?'} ${p.y||''}）"><span class="dot d${p.d}"></span><span class="cid">${p.id}</span>${p.t}</span>`
    ).join('');
    const pre = preOf.get(n.key) || [];
    const prow = pre.length
      ? `<div class="prow">前置 →${pre.map(k =>
          `<span class="pchip" data-key="${k}" data-tip="${k}｜点击跳转">${k.split('/')[1]}</span>`).join('')}</div>`
      : '';
    const mst = DATA.mastery ? DATA.mastery.nodes[n.key] : null;
    if (mst) el.classList.add(M_CLS[mst.status] || 'm-none');
    const mstHtml = mst
      ? ` <span class="mst ${M_CLS[mst.status]||'m-none'}">${mst.status}${
          mst.mastery!=null ? ' '+Math.round(mst.mastery*100)+'%' : ''}${mst.n ? ' n='+mst.n : ''}</span>`
      : '';
    el.innerHTML = `<div class="nhead"><span class="nname">${n.name}${mstHtml}</span><span class="ntotal">${n.total} 题</span></div>
      <div class="heat">${cells}</div>${prow}
      <details><summary>题目列表</summary><div class="plist">${chips}</div></details>`;
    grid.appendChild(el);
  }
}
/* 前置 chip 点击跳转 + 悬停节点卡高亮前置/后继 */
app.addEventListener('click', e => {
  const ch = e.target.closest('.pchip');
  if (!ch || !ch.dataset.key) return;
  const tgt = document.getElementById('nd-' + ch.dataset.key);
  if (!tgt) return;
  tgt.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tgt.classList.remove('flash'); void tgt.offsetWidth; tgt.classList.add('flash');
});
app.addEventListener('mouseover', e => {
  const nd = e.target.closest('.node');
  document.querySelectorAll('.node.hl-pre,.node.hl-succ')
    .forEach(x => x.classList.remove('hl-pre', 'hl-succ'));
  if (!nd) return;
  (preOf.get(nd.dataset.key) || []).forEach(k =>
    document.getElementById('nd-' + k)?.classList.add('hl-pre'));
  (succOf.get(nd.dataset.key) || []).forEach(k =>
    document.getElementById('nd-' + k)?.classList.add('hl-succ'));
});
/* hover tooltip */
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e=>{
  const t = e.target.closest('[data-tip]');
  if(!t){ tip.style.display='none'; return; }
  const [l1,l2] = t.dataset.tip.split('|');
  tip.innerHTML = `<div>${l1}</div>` + (l2?`<div class="t2">${l2}</div>`:'');
  tip.style.display='block';
});
document.addEventListener('mousemove', e=>{
  if(tip.style.display==='none') return;
  const x = Math.min(e.clientX+14, innerWidth-320), y = Math.min(e.clientY+16, innerHeight-70);
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
/* search + difficulty filter */
let df = 0;
const applyFilter = ()=>{
  const q = document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('.chip').forEach(ch=>{
    const okD = df===0 || Number(ch.dataset.d)===df;
    const okQ = !q || ch.dataset.txt.includes(q);
    ch.classList.toggle('hide', !okD);
    ch.classList.toggle('dimm', okD && !okQ);
  });
  document.querySelectorAll('.node').forEach(nd=>{
    const vis = nd.querySelectorAll('.chip:not(.hide):not(.dimm)').length;
    nd.classList.toggle('dim', (q!==''||df!==0) && vis===0);
    if(q!=='' && vis>0) nd.querySelector('details').open = true;
  });
};
document.getElementById('q').addEventListener('input', applyFilter);
document.querySelectorAll('.fbtn[data-d]').forEach(b=>b.addEventListener('click', ()=>{
  df = Number(b.dataset.d);
  document.querySelectorAll('.fbtn[data-d]').forEach(x=>x.classList.toggle('on', x===b));
  applyFilter();
}));
/* 掌握层开关（无学生证据时 DATA.mastery 为 null，按钮保持隐藏） */
if (DATA.mastery) {
  const mb = document.getElementById('masteryBtn');
  mb.hidden = false;
  mb.textContent = `掌握层：${DATA.mastery.student} 证据 ${DATA.mastery.evidence} 条`;
  mb.addEventListener('click', ()=>{
    const on = document.getElementById('root').classList.toggle('show-mastery');
    mb.classList.toggle('on', on);
  });
}
/* theme toggle */
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  r.setAttribute('data-theme', now);
});
</script>
</body>
</html>
