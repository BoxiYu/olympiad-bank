<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}奥数训练台{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  // 明暗主题：跟随系统，可手动切换（记忆在本机浏览器）
  (function () {
    const saved = localStorage.getItem('ob-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🏔️ 奥数训练台</a>
  <nav>
    <a href="/" {% if nav == 'home' %}class="on"{% endif %}>今日训练</a>
    <button id="themeBtn" title="切换明暗" type="button">◐</button>
  </nav>
</header>
<main class="wrap">
  {% if err %}<div class="flash err">⚠️ {{ err }}</div>{% endif %}
  {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="foot">数学公式渲染需要联网（KaTeX CDN）；断网时公式会显示为 $…$ 原文，不影响训练流程。</footer>
<script src="/static/app.js"></script>
</body>
</html>
