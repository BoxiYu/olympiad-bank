# 赛事难度层级表：归一化赛名 → 难度底档 base(★1–5)
# 星级语义见 SPEC §4（唯一正本；本表只管赛名 → 底档映射）。
# 用途：MathNet 候选池的 difficulty_est 第一层（就低不就高：与其他信号冲突时取低值）。
# 赛名归一化：小写、去 4 位年份/序数/罗马数字/标点、压空格（见 scripts 管线）。
# tiers 覆盖 top-220 规范名（74.8% 行）；名内已含轮次词的 base 已计入轮次，fallback_modifiers 只作用于表外长尾。
# default_unknown：完全未知赛名的默认档。est 永远不是正式 difficulty——入库时按 SPEC 第 4 节思维跨度定稿。
# 学段下界（正本 SPEC §4）：本库只收初中+高中，★1 是小学/低龄档不入库。
# 本表的 base: 1（8 条初轮/资格轮赛名）与 kangaroo 修正**照旧保留**——它们是对真实难度的估计，
# 不因准入线变化而改写；est=1 的含义变为「预筛掉，不必送评审」。
# 校准（2026-08-03，独立重算）：ISL2024 30/30、AIME2022 2/2、USAMO2010 1/1、APMO2025 5/5，合计 38/38=100% 在 ±1 内（阈值 80%）。
