fallback_modifiers:
- pattern: (?i)(math circle|monthly contest)
  effect: 直接定为2
  note: 圈子月赛为take-home证明题，不符★1的2–5分钟单步描述；直接定级规则按列表顺序求值，命中即终止，后续加减规则不再应用（所有修正仅作用于未命中 tiers 表的表外长尾赛名）
- pattern: (?i)(kangaroo|känguru)
  effect: 直接定为1
  note: 普及速答类；直接定级，命中即终止
- pattern: (?i)\b(imo|international mathematical olympiad)\b(?!.*(junior|prelim|first|booklet|training))
  effect: 直接定为4
  note: IMO 正赛/直接冠 IMO 名的长尾条目；4–5 就低取4；lookahead 排除 junior/prelim/first/booklet/training，防止训练册与低龄选拔被误定4
- pattern: (?i)\b(tst|tstst|team selection|selection (test|exam|examination|contest)|selektion|selectietoets|auswahlwettbewerb)\b
  effect: +1（上限5）
  note: TST/选拔类；若同名还含 junior/jbmo 则不加（junior 修正优先）；preliminary selection 类先命中初轮规则者按初轮处理
- pattern: (?i)\b(shortlist(ed)?|short list|shl)\b
  effect: +1（上限5）
  note: 候选题通常难于正赛均值
- pattern: (?i)\b(final round|finalrunde|final stage|third round|last round)\b
  effect: +1（上限5）
  note: 决赛轮
- pattern: (?i)\b(first round|1st round|round one|preliminary|prelim|qualif\w*|vorrunde\w*|district|regional|area stage|school round)\b
  effect: -1（下限1）
  note: 初轮/资格/地区轮
- pattern: (?i)\b(junior|jbmo|cadet|youth|nível 1|beginner)\b
  effect: -1（下限1）
  note: 低龄组；与 shortlist/final 同现时先减后加
- pattern: (?i)\b(booklet|training|preparation|préparation|envoi|problem set)\b
  effect: -0（保持 default，标记 low-conf）
  note: 训练材料难度混杂，不加不减仅降置信度
default_unknown:
  base: 2
  conf: low
