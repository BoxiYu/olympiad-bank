# MathNet topics_flat → taxonomy/registry.yml 规范节点映射表
# 用途：MathNet 候选池管线的「知识点—标签流」查表层；registry.yml 与 lint 零改动。
# 结构：normalize（查表前字符串归一化：NFC、压空格、弯引号转直、修已知拼写变体）
#       map（归一化路径 → 板块+规范节点；weak=true 为解题动作类兜底标签，仅当该题无其他标签时计入）
#       board_only（只能定板块的 Other/无叶截断路径，知识点留待读题旁路）
#       ignore（超奥数口径，显式排除——不允许静默丢弃）
# 生成：2026-08-03，AI 分板块起草+对抗审核；175 条路径完备覆盖 ShadenA/MathNet v0 全库（27,817 行）。
# 维护：数据集升级出现新路径时 → 补表（map/ignore 三选一）后再跑管线；节点名以 registry.yml 为唯一真理源。
version: 1
# keyword_rules：MathNet 标签树盖不住的节点走全文正则召回（仅当该行已投对应板块票时附加，控误报）
keyword_rules:
- pattern: (?i)\bramsey\b|van der waerden|schur'?s theorem
  category: combinatorics
  node: Ramsey 型问题
  note: 标签树无 Ramsey 叶子（最近仅 van der Waerden 3 行且挂在被 ignore 的代数数论下）。
    收紧记：初版含裸 monochromatic，Codex 试点复核 6 题仅 1 题真属 Ramsey——普通染色题已由
    「染色与不变量」覆盖，故只保留拉姆齐理论的专名信号。
- pattern: (?i)lifting the exponent|\bLTE\b|p-adic|v_\{?p\}?\(|\\nu_p
  category: number-theory
  node: p-adic 赋值与 LTE
  note: 标签树无对应叶子，靠 LTE/p 进赋值记号召回
normalize:
- from: 'Algebra > Algebraic Expressions > Polynomials > Irreducibility: Rational Root Theorem, Gauss’s Lemma'
  to: 'Algebra > Algebraic Expressions > Polynomials > Irreducibility: Rational Root Theorem, Gauss''s Lemma'
- from: Geometry > Plane Geometry > Quadrilaterals > Cyclic quadrilaterials
  to: Geometry > Plane Geometry > Quadrilaterals > Cyclic quadrilaterals
- from: Geometry > Plane Geometry > Quadrilaterals > Inscribed/circumscribed quadrilaterials
  to: Geometry > Plane Geometry > Quadrilaterals > Inscribed/circumscribed quadrilaterals
- from: Geometry > Plane Geometry > Quadrilaterals > Inscribed/circumscribed quadrilaterrals
  to: Geometry > Plane Geometry > Quadrilaterals > Inscribed/circumscribed quadrilaterals
- from: 'Geometry > Plane Geometry > Triangles > Triangle centers: centroid, incenter,    circumcenter, Euler line, nine-point circle'
  to: 'Geometry > Plane Geometry > Triangles > Triangle centers: centroid, incenter, circumcenter, Euler line, nine-point circle'
- from: 'Geometry > Plane Geometry > Triangles > Triangle centers: centroid, incenter, circumcenter, Euler line, nine-point circle'
  to: 'Geometry > Plane Geometry > Triangles > Triangle centers: centroid, incenter, circumcenter, orthocenter, Euler line, nine-point circle'
map:
  Geometry > Plane Geometry > Miscellaneous > Angle chasing:
    category: geometry
    node: 三角形与四边形基本性质
    weak: true
    reason: 导角是解题动作非知识点，registry 该节点已有别名「角度计数」，作兜底
  Discrete Mathematics > Combinatorics > Coloring schemes, extremal arguments:
    category: combinatorics
    node: 染色与不变量
    weak: true
    reason: 标签并置染色与极端论证两类技法：染色取头词映射到染色与不变量，但极端论证部分本应属极端原理，单节点映射有损，故标弱作兜底
  ? 'Geometry > Plane Geometry > Triangles > Triangle centers: centroid, incenter, circumcenter, orthocenter, Euler line, nine-point circle'
  : category: geometry
    node: 三角形五心与经典引理
    reason: 五心、欧拉线、九点圆正是该节点的核心内容
  Number Theory > Divisibility / Factorization > Factorization techniques:
    category: number-theory
    node: 素数与算术基本定理
    reason: 因式分解技巧（平方差分解、链分解、Zsygmondy 型分解等）在 registry 中正是该节点的别名族，对应算术基本定理层面的分解
  Geometry > Plane Geometry > Quadrilaterals > Cyclic quadrilaterals:
    category: geometry
    node: 圆与四点共圆
    reason: 圆内接四边形即四点共圆，节点别名直接含「四点共圆」
  Geometry > Plane Geometry > Circles > Tangents:
    category: geometry
    node: 圆与四点共圆
    reason: 切线性质归圆的基本节点，别名含「圆的切线」「弦切角」
  Discrete Mathematics > Combinatorics > Invariants / monovariants:
    category: combinatorics
    node: 染色与不变量
    reason: 不变量/单调量正是该节点内涵，registry 别名已含「不变量」「单调量」
  'Number Theory > Diophantine Equations > Techniques: modulo, size analysis, order analysis, inequalities':
    category: number-theory
    node: 不定方程
    reason: 叶子是解法枚举，但父级 Diophantine Equations 已精确锁定知识点为不定方程
  Algebra > Algebraic Expressions > Polynomials > Polynomial operations:
    category: algebra
    node: 多项式
    reason: 多项式四则与恒等运算即多项式节点核心内容
  Geometry > Plane Geometry > Miscellaneous > Distance chasing:
    category: geometry
    node: 面积法与三角法
    weak: true
    reason: 算长度是解题动作，正余弦定理等度量计算最接近三角法节点，仅作兜底
  Algebra > Equations and Inequalities > Linear and quadratic inequalities:
    category: algebra
    node: 不等式
    reason: 一次二次不等式直接归不等式节点
  Algebra > Prealgebra / Basic Algebra > Integers:
    category: algebra
    node: 代数变换技巧
    weak: true
    reason: 基础整数运算杂类无对应知识点，技巧节点兜底，内容混杂待读题细化
  Discrete Mathematics > Combinatorics > Counting two ways:
    category: combinatorics
    node: 计数与容斥
    reason: 算两次即双计数，registry 该节点别名已含「双计数」
  Number Theory > Divisibility / Factorization > Prime numbers:
    category: number-theory
    node: 素数与算术基本定理
    reason: 素数性质与素因子分解直接对应该节点
  Geometry > Plane Geometry > Miscellaneous > Constructions and loci:
    category: geometry
    node: 三角形与四边形基本性质
    weak: true
    reason: 作图与轨迹无专门节点，Miscellaneous 泛化标签兜底到最粗的基本性质节点
  Number Theory > Divisibility / Factorization > Greatest common divisors (gcd):
    category: number-theory
    node: 最大公约数与欧几里得算法
    reason: gcd 即该节点本体，别名含最大公约数、欧几里得算法
  Discrete Mathematics > Combinatorics > Pigeonhole principle:
